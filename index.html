<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>忍者跳跃 · H5 游戏骨架</title>
<style>
  :root {
    --ink: #f4ede2;
    --ink-dim: #9fb3b8;
    --amber: #ffd79a;
    --vermilion: #e8503a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1b22;
    color: var(--ink);
    font-family: 'Trebuchet MS', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  #hud b { color: var(--amber); font-weight: 700; }

  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    opacity: 0.75;
    pointer-events: none;
    white-space: nowrap;
  }

  /* 触屏设备才显示虚拟按键 */
  #pad {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }

  @media (pointer: coarse) {
    #pad { display: flex; }
    #hint { display: none; }
  }

  #pad button {
    pointer-events: auto;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 1px solid rgba(244, 237, 226, 0.28);
    background: rgba(13, 27, 34, 0.55);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    backdrop-filter: blur(6px);
  }

  #pad button:active { background: rgba(232, 80, 58, 0.55); }
  #pad .group { display: flex; gap: 12px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="hud">
    <div><b>忍者跳跃</b> · H5 骨架 v0.1</div>
    <div>FPS <b id="fps">--</b></div>
  </div>

  <div id="hint">← → / A D 移动 · 空格 / W / ↑ 跳跃 · R 重开</div>

  <div id="pad">
    <div class="group">
      <button data-key="left" aria-label="左移">◀</button>
      <button data-key="right" aria-label="右移">▶</button>
    </div>
    <button data-key="jump" aria-label="跳跃">跳</button>
  </div>

<script>
(() => {
  'use strict';

  // ============================================================
  // 0. 常量与工具
  // ============================================================
  const WORLD = { width: 960, height: 540 };   // 逻辑分辨率（内部坐标系固定）
  const STEP = 1 / 60;                        // 固定步长，物理与帧率解耦
  const GRAVITY = 2200;                       // px/s^2
  const MOVE_SPEED = 320;                     // px/s
  const GROUND_ACCEL = 2600;                  // 地面加速度
  const AIR_ACCEL = 1500;                     // 空中加速度
  const JUMP_SPEED = 780;                     // 起跳初速度

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // 老版本 WebView 可能没有 roundRect，退化为直角矩形
  const roundRect = (x, y, w, h, r) => {
    if (typeof ctx.roundRect === 'function') {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    } else {
      ctx.beginPath();
      ctx.rect(x, y, w, h);
    }
    ctx.fill();
  };

  // ============================================================
  // 1. 引擎层：画布、缩放、主循环
  // ============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const fpsEl = document.getElementById('fps');

  let scale = 1;
  let dpr = 1;

  /** 画布按逻辑分辨率等比缩放并居中（letterbox），避免移动端拉伸变形 */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    scale = Math.min(vw / WORLD.width, vh / WORLD.height);

    canvas.width = Math.round(WORLD.width * scale * dpr);
    canvas.height = Math.round(WORLD.height * scale * dpr);
    canvas.style.width = Math.round(WORLD.width * scale) + 'px';
    canvas.style.height = Math.round(WORLD.height * scale) + 'px';
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ============================================================
  // 2. 输入层：键盘 + 触屏，统一成一份按键状态
  // ============================================================
  const keys = { left: false, right: false, jump: false };

  const KEY_MAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump'
  };

  window.addEventListener('keydown', (e) => {
    const action = KEY_MAP[e.code];
    if (!action) return;
    e.preventDefault();
    keys[action] = true;
    if (action === 'jump' && !e.repeat) jumpQueued = true;
  });

  window.addEventListener('keyup', (e) => {
    const action = KEY_MAP[e.code];
    if (action) keys[action] = false;
  });

  // 虚拟按键：按下 / 松开分别写入 keys，与键盘共用同一套状态
  document.querySelectorAll('#pad button').forEach((btn) => {
    const action = btn.dataset.key;
    const down = (e) => { e.preventDefault(); keys[action] = true; if (action === 'jump') jumpQueued = true; };
    const up = (e) => { e.preventDefault(); keys[action] = false; };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  });

  // ============================================================
  // 3. 游戏层：状态、实体、逻辑更新
  // ============================================================
  let jumpQueued = false;      // 跳跃请求（按下瞬间置位，物理步消费后清空）
  let score = 0;               // TODO 正式玩法接入计分
  let player;

  function createPlayer() {
    return {
      x: 160,
      y: WORLD.height - 120,
      w: 36,
      h: 48,
      vx: 0,
      vy: 0,
      onGround: true
    };
  }

  function reset() {
    player = createPlayer();
    score = 0;
    jumpQueued = false;
  }

  const GROUND_Y = WORLD.height - 72;   // TODO 改为关卡数据

  function update(dt) {
    // 水平移动：区分地面/空中加速度
    const accel = player.onGround ? GROUND_ACCEL : AIR_ACCEL;
    if (keys.left) player.vx -= accel * dt;
    if (keys.right) player.vx += accel * dt;
    if (!keys.left && !keys.right) player.vx *= 0.86;   // 摩擦衰减
    player.vx = clamp(player.vx, -MOVE_SPEED, MOVE_SPEED);

    // 跳跃：仅在落地时可起跳
    if (jumpQueued) {
      if (player.onGround) {
        player.vy = -JUMP_SPEED;
        player.onGround = false;
      }
      jumpQueued = false;
    }

    // 重力
    player.vy += GRAVITY * dt;

    // 位移
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // 边界与地面碰撞
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x + player.w > WORLD.width) { player.x = WORLD.width - player.w; player.vx = 0; }
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    // TODO 在此处接入：敌人 AI、道具拾取、碰撞检测、关卡推进
  }

  // ============================================================
  // 4. 渲染层
  // ============================================================
  function drawBackground(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, WORLD.height);
    sky.addColorStop(0, '#10242e');
    sky.addColorStop(0.55, '#1d3d47');
    sky.addColorStop(1, '#c78a5a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, WORLD.width, WORLD.height);

    // 月亮
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffd79a';
    ctx.beginPath();
    ctx.arc(WORLD.width - 150, 118, 42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 远山剪影
    ctx.fillStyle = 'rgba(13, 27, 34, 0.55)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= WORLD.width; x += 40) {
      const y = GROUND_Y - 120 - Math.sin(x / 130 + 0.6) * 46 - Math.sin(x / 47) * 12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(WORLD.width, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    // 地面
    ctx.fillStyle = '#0d1b22';
    ctx.fillRect(0, GROUND_Y, WORLD.width, WORLD.height - GROUND_Y);
    ctx.fillStyle = 'rgba(244, 237, 226, 0.18)';
    ctx.fillRect(0, GROUND_Y, WORLD.width, 3);
  }

  function drawPlayer(t) {
    const bob = player.onGround ? Math.sin(t / 180) * 1.5 : 0;
    const x = player.x;
    const y = player.y + bob;

    // 围巾（随速度飘动）
    ctx.save();
    ctx.strokeStyle = '#e8503a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + player.w - 4, y + 16);
    ctx.quadraticCurveTo(
      x + player.w + 18 - player.vx * 0.03, y + 12,
      x + player.w + 30 - player.vx * 0.05, y + 24 + Math.sin(t / 120) * 4
    );
    ctx.stroke();
    ctx.restore();

    // 身体
    ctx.fillStyle = '#e8503a';
    roundRect(x, y, player.w, player.h, 10);

    // 头带
    ctx.fillStyle = '#1f2933';
    ctx.fillRect(x, y + 14, player.w, 8);

    // 眼睛
    ctx.fillStyle = '#f4ede2';
    ctx.fillRect(x + 8, y + 26, 5, 5);
    ctx.fillRect(x + player.w - 13, y + 26, 5, 5);
  }

  function render(t) {
    ctx.save();
    ctx.scale(scale * dpr, scale * dpr);
    drawBackground(t);
    drawPlayer(t);
    ctx.restore();
  }

  // ============================================================
  // 5. 主循环：固定步长累加 + 渲染
  // ============================================================
  let last = performance.now();
  let acc = 0;
  let fps = 0;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;      // 切后台回来不要一次补太多帧

    acc += dt;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }

    render(now);

    fps = fps * 0.9 + (1 / Math.max(dt, 0.0001)) * 0.1;
    fpsEl.textContent = Math.round(fps);

    requestAnimationFrame(frame);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') reset();
  });

  // 切到后台时暂停，回来重置时间基准
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { last = performance.now(); acc = 0; }
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
