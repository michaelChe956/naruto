<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>忍者跳跃 · H5 游戏骨架</title>
<style>
  :root {
    --ink: #f4ede2;
    --ink-dim: #9fb3b8;
    --amber: #ffd79a;
    --vermilion: #e8503a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1b22;
    color: var(--ink);
    font-family: 'Trebuchet MS', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }

  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  #hud b { color: var(--amber); font-weight: 700; }

  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    opacity: 0.75;
    pointer-events: none;
    white-space: nowrap;
  }

  /* 触屏设备才显示虚拟按键 */
  #pad {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }

  @media (pointer: coarse) {
    #pad { display: flex; }
    #hint { display: none; }
  }

  #pad button {
    pointer-events: auto;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 1px solid rgba(244, 237, 226, 0.28);
    background: rgba(13, 27, 34, 0.55);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    backdrop-filter: blur(6px);
  }

  #pad button:active { background: rgba(232, 80, 58, 0.55); }
  #pad .group { display: flex; gap: 12px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="hud">
    <div><b>忍者跳跃</b> · H5 骨架 v0.1</div>
    <div>FPS <b id="fps">--</b></div>
  </div>

  <div id="hint">← → / A D 移动 · 空格 / W / ↑ 跳跃 · R 重开</div>

  <div id="pad">
    <div class="group">
      <button data-key="left" aria-label="左移">◀</button>
      <button data-key="right" aria-label="右移">▶</button>
    </div>
    <button data-key="jump" aria-label="跳跃">跳</button>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
